  label: ['zip', 'postal', 'post code', 'postcode']
  autocomplete: [postal-code]
  name: ['zip', 'postal']
  fact: candidate.address.postal_code
- id: region
  qclass: FACTUAL
  label: ['^(state|province|region)( of residence| ?/ ?province| or province| ?/ ?region)?$', '^state/province', '^state \(', '^province \(']
  exclude: ['united states', 'statement', 'country', 'city']
  autocomplete: [address-level1]
  name: ['\bstate\b', 'province', 'region']
