- id: address_line1
  qclass: FACTUAL
  label: ['^(street )?address( line 1)?$', 'address line 1', '^street', 'mailing address', 'home address']
  autocomplete: [address-line1, street-address]
  name: ['address.?line.?1', 'address1', 'street']
  fact: candidate.address.street
- id: city
  qclass: FACTUAL
  label: ['^city$', '^city ', '\btown\b', '^city/']
  exclude: ['state', 'country']
  autocomplete: [address-level2]
  name: ['\bcity\b']
  fact: candidate.address.city
- id: postal_code
