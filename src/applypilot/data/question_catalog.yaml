- id: location
  qclass: FACTUAL
  label: ['^(current )?location', 'city,? state', 'where (are you|do you) (currently )?(located|based|live|reside)', 'current (city|residence)', 'location \(city\)']
  exclude: ['prefer', 'interested', 'which (office|location)', 'willing', 'relocat', 'work location']
