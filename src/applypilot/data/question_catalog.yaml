# Deterministic question catalog: maps application questions to the source of truth.
#
# Entries are checked IN ORDER; the first match wins, so specific patterns come before
# general ones. Matching fields (all optional, any one suffices unless noted):
#   label:         regexes searched in the lower-cased question label (plus placeholder if label is empty)
#   name:          regexes searched in the input's name/id attribute (weaker; used only if no label match)
#   autocomplete:  exact HTML autocomplete tokens
#   types:         restrict to these field types
#   exclude:       regexes that veto a label match
# Value specs:
#   fact: candidate.path                 authoritative candidate fact
#   facts: [path, path]                  first non-empty
#   pref: preferences.path               user preference
#   eeo: key                             preferences.eeo.<key> (never inferred)
#   derived: name                        computed by questions/derived.py from facts
#   compose: "{candidate.a} {candidate.b}"  string built from facts (all must exist)
#   written: template_name               personalized prose via templates + Astra
#   file: resume | cover_letter
#   ask: true                            always semantic (Astra) but with a known class
# qclass: FACTUAL | PREFERENCE | EEO | WRITTEN | JOB_SPECIFIC | CONSENT | FILE | UNKNOWN

# ---------------------------------------------------------------- files
- id: resume_file
  qclass: FILE
  types: [file]
  label: ['resume', '\bcv\b', 'curriculum vitae']
  name: ['resume', '\bcv\b']
  file: resume
- id: cover_letter_file
  qclass: FILE
  types: [file]
  label: ['cover letter', 'motivation letter']
  name: ['cover']
  file: cover_letter
- id: transcript_file
  qclass: FILE
  types: [file]
  label: ['transcript']
  file: transcript

# ---------------------------------------------------------------- identity
- id: email_confirm
  qclass: FACTUAL
  label: ['(confirm|re-?enter|verify|repeat).{0,20}e-?mail']
  fact: candidate.identity.email
- id: email
  qclass: FACTUAL
  label: ['e-?mail']
  exclude: ['referr', 'manager', 'reference', 'opt.?in', 'subscribe', 'marketing', 'newsletter']
  autocomplete: [email]
  name: ['e-?mail']
  types: [text, email]
  fact: candidate.identity.email
- id: first_name
  qclass: FACTUAL
  label: ['^(legal )?first( name)?$', '^given name', '^first name', 'legal first name', '^name \(first\)']
  exclude: ['preferred', 'referr', 'emergency', 'reference']
  autocomplete: [given-name]
  name: ['first.?name', '\bfname\b', 'given.?name', 'firstname']
  fact: candidate.identity.first_name
- id: last_name
  qclass: FACTUAL
  label: ['^(legal )?last( name)?$', '^(family|sur) ?name', '^last name', 'legal last name', '^name \(last\)']
  exclude: ['preferred', 'referr', 'emergency', 'reference']
  autocomplete: [family-name]
  name: ['last.?name', '\blname\b', 'family.?name', 'surname', 'lastname']
  fact: candidate.identity.last_name
- id: middle_name
  qclass: FACTUAL
  label: ['middle (name|initial)']
  autocomplete: [additional-name]
  name: ['middle.?name']
  fact: candidate.identity.middle_name
- id: preferred_name
  qclass: FACTUAL
  label: ['preferred (first )?name', 'nick ?name', 'name you go by', 'preferred name']
  facts: [candidate.identity.preferred_name, candidate.identity.first_name]
- id: full_name
  qclass: FACTUAL
  label: ['^(full |legal |your )?name$', '^full (legal )?name', '^name \(as it appears', '^candidate name', 'signature', 'type your (full )?name', 'electronic signature']
  exclude: ['referr', 'company', 'school', 'university', 'manager', 'emergency', 'reference', 'user ?name', '\bdate\b']
  autocomplete: [name]
  name: ['^name$', 'full.?name', '^_?name$']
  compose: '{candidate.identity.first_name} {candidate.identity.last_name}'
- id: phone_country_code
  qclass: FACTUAL
  label: ['(phone )?country (phone )?code', 'dialing code', 'phone code']
  derived: phone_country_code
- id: phone_device_type
  qclass: PREFERENCE
  label: ['phone (device )?type', 'type of phone', 'device type']
  pref: preferences.application.phone_device_type
- id: phone_extension
  qclass: FACTUAL
  label: ['phone extension', '^extension$']
  fact: candidate.identity.phone_extension
- id: phone
  qclass: FACTUAL
  label: ['phone', '\bmobile\b', '\bcell\b', 'telephone', 'contact number']
  exclude: ['text message', 'sms', 'reference', 'emergency', 'type', 'develop', '\bapps?\b', 'experience', 'device']
  autocomplete: [tel, tel-national]
  name: ['phone', 'mobile', '\btel\b']
  derived: phone
- id: pronouns
  qclass: EEO
  label: ['pronoun']
  eeo: pronouns

