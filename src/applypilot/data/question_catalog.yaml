- id: country
  qclass: FACTUAL
  label: ['^country', 'country of residence', 'country/region', 'country / region']
  exclude: ['code', 'citizen', 'authori', 'work in']
  autocomplete: [country, country-name]
  name: ['\bcountry\b']
