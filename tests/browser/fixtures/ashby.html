<!doctype html><html><head><title>Ashby-style fixture</title></head><body><form class="ashby-application-form"><h1>Machine Learning Intern</h1><label id="country-label">Country of residence</label><div role="combobox" aria-labelledby="country-label" aria-controls="countries" aria-required="true" tabindex="0" data-value="">Choose country</div><div role="listbox" id="countries" hidden><div role="option" data-value="United States">United States</div><div role="option" data-value="Canada">Canada</div></div><label>Graduation date<input type="date" name="graduation" required></label><button type="button">Continue</button></form><script>
const combo=document.querySelector('[role="combobox"]'),list=document.getElementById('countries');combo.addEventListener('click',()=>{list.hidden=false;});list.addEventListener('click',e=>{if(e.target.getAttribute('role')==='option'){combo.textContent=e.target.textContent;combo.setAttribute('data-value',e.target.dataset.value);e.target.setAttribute('aria-selected','true');list.hidden=true;}});
</script></body></html>
