# =====================================================================================
# candidate.yaml — YOUR AUTHORITATIVE FACTS (the source of truth for every factual answer)
# =====================================================================================
# ApplyPilot never guesses a fact. Every factual application question (name, school,
# graduation date, GPA, work authorization, citizenship, employers, ...) is answered from
# THIS file, and the audit log records the exact path used (e.g. candidate.education.gpa).
#
#   null  = UNKNOWN (never treated as false). A required question that needs an unknown fact
#           parks the application as NEEDS_USER and tells you which path to fill in.
#   Keep real data out of git: put it in config/candidate.local.yaml (git-ignored); it is
#   merged over this file key by key. See config/examples/candidate.example.yaml for a
#   fully filled-in FICTIONAL example of the format.
#   Dates: quote ISO dates: "2028-05-15" (or "2028-05" when only the month is known).
#   Booleans: true / false / null only (validated at startup).
# =====================================================================================

identity:
  first_name: null            # Legal first name exactly as on official documents.
  middle_name: null           # Optional; only used when a form asks.
  last_name: null             # Legal last name.
  preferred_name: null        # Used for "Preferred name" questions; falls back to first_name.
  email: null                 # Email used on applications (and ATS accounts unless overridden in .env).
  phone: null                 # Include the country code in your preferred format, e.g. "+1 555 010 0199".
  phone_country_code: null    # Optional explicit dialing code, e.g. "+1" (derived from phone when it starts with +).
  phone_extension: null

address:
  street: null                # Street address line 1.
  street2: null               # Apartment/suite (optional).
  city: null
  region: null                # State/province. Two-letter US codes (e.g. WA) are expanded automatically.
  postal_code: null           # Quote it to keep leading zeros: "02139".
  country: null               # Country name, e.g. "United States".

links:
  linkedin: null              # Full URL.
  github: null
  portfolio: null
  website: null
  twitter: null

education:
  university: null            # Official institution name.
  degree_level: null          # One of: high_school, associate, bachelor, master, mba, phd, other
  degree: null                # Full degree name, e.g. "Bachelor of Science in Computer Science".
  major: null
  minor: null
  start_date: null            # "YYYY-MM-DD" or "YYYY-MM".
  graduation_date: null       # Expected/actual graduation; drives graduation-window eligibility checks.
  gpa: null                   # Number, e.g. 3.72. Leave null if you do not want to disclose (optional GPA questions are then skipped).
  gpa_scale: null             # e.g. 4.0
  currently_enrolled: null    # true / false

# Work authorization per country (ISO code). NEVER inferred across countries: a question about
# Canada is only answered from the CA block. Add blocks for every country you apply to.
work_authorization:
  US:
    authorized: null                  # Legally authorized to work in the US today?
    requires_sponsorship_now: null    # Need visa sponsorship to start this job?
    requires_sponsorship_future: null # Will you need sponsorship later (e.g. OPT → H-1B)? Answers "now or in the future" questions.
    citizen: null
    permanent_resident: null
  CA:
    authorized: null
    requires_sponsorship_now: null
    requires_sponsorship_future: null
    citizen: null
    permanent_resident: null

eligibility:
  citizenships: []            # Country names or ISO codes, e.g. [US].
  age_18_or_older: null
  us_person: null             # Export-control "U.S. person" (citizen, permanent resident, asylee/refugee). Derived when null and you are a citizen/PR.
  security_clearance: null    # e.g. "None", "Secret". Answers "Do you hold an active clearance?"
  can_obtain_clearance: null  # true / false

experience:
  current_employer: null
  current_title: null
  total_years: null           # Years of professional experience (a number you can defend).
  employers: []               # EVERY employer, e.g. [{company: "Acme Corp", title: "Software Intern", start: "2025-06", end: "2025-08"}]
  employment_history_complete: null  # Set true once `employers` lists everyone → "Have you worked for X before?" is answered automatically.
  skills: []                  # Real skills only (context for written answers; missing skills NEVER cause a skip).

# Exact answers for factual questions that the standard fields above do not cover.
# They are matched by question similarity (≥ 0.9) and optionally scoped to one company ("*" = any).
# Shape (uncomment and use YOUR real answers):
# factual_answers:
#   - question: "Do you have any relatives employed by this company?"
#     company: "*"
#     value: false
#   - question: "Are you subject to a non-compete agreement?"
#     value: false
factual_answers: []
